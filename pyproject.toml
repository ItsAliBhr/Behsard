[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "behsard"
version = "0.2.2"
description = "On-site per-worker carton counting by reading ink stamps with cameras"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "pytesseract>=0.3.10",
    "rapidfuzz>=3.0",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "jdatetime>=5.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.40", "psutil>=5.9"]

[project.scripts]
behsard = "behsard.cli:main"
behsard-app = "behsard.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
behsard = ["web/templates/*.html", "web/static/*", "core/schema.sql", "default_config.yaml", "recognition/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["slow: slower tests (tesseract, video)", "e2e: browser tests against a running app", "rtsp: needs MediaMTX + ffmpeg", "soak: long-running resource test"]
