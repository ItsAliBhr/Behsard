name: tests

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  schedule:
    - cron: "17 1 * * *"  # nightly soak
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System tools (Tesseract, ffmpeg, MediaMTX)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr ffmpeg
          curl -sSfL https://github.com/bluenviron/mediamtx/releases/download/v1.9.3/mediamtx_v1.9.3_linux_amd64.tar.gz | tar xz -C /tmp mediamtx
          sudo mv /tmp/mediamtx /usr/local/bin/
      - name: Python deps
        run: |
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Tests (unit, regression, end-to-end, RTSP, browser)
        run: python -m pytest -v -rs

  soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr ffmpeg
          pip install -e ".[dev]"
      - name: 2-hour soak, 2 cameras 3200x1800
        env:
          BEHSARD_SOAK_MINUTES: "120"
        run: python -m pytest tests/test_soak.py -v -s
