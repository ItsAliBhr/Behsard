<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}بهسرد{% endblock %} — شمارش کارتن</title>
<script src="/static/htmx.min.js"></script>
<style>
  :root {
    --bg:#f3f5f9; --card:#fff; --ink:#1d2433; --muted:#6a7385; --line:#e3e7ef; --soft:#f6f8fb;
    --accent:#2563eb; --accent-2:#1d4ed8; --accent-soft:#e8efff;
    --ok:#15803d; --ok-soft:#e7f6ec; --warn:#b45309; --warn-soft:#fff4e0; --bad:#c62828; --bad-soft:#fdecec;
    --nav:#111827; --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.06), 0 4px 14px rgba(16,24,40,.06);
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Vazirmatn", "Segoe UI", Tahoma, sans-serif; background:var(--bg); color:var(--ink); font-size:15px; line-height:1.7; }
  header { position:sticky; top:0; z-index:20; background:var(--nav); color:#fff; display:flex; flex-wrap:wrap; align-items:center; gap:6px 6px; padding:10px 22px; box-shadow:0 2px 10px rgba(0,0,0,.18); font-size:15px; }
  header .brand { font-weight:bold; font-size:17px; margin-left:18px; display:flex; align-items:center; gap:8px; }
  header .brand::before { content:""; width:12px; height:12px; border-radius:4px; background:linear-gradient(135deg,#60a5fa,#2563eb); display:inline-block; }
  header a { color:#cbd5e1; text-decoration:none; padding:6px 12px; border-radius:999px; transition:background .15s, color .15s; }
  header a:hover { background:rgba(255,255,255,.08); color:#fff; }
  header a.active { background:var(--accent); color:#fff; }
  .badge { background:#f97316; color:#fff; border-radius:999px; padding:0 8px; font-size:12px; margin-right:4px; }
  .ok-dot, .bad-dot, .warn-dot { display:inline-block; width:10px; height:10px; border-radius:50%; vertical-align:middle; }
  .ok-dot { background:var(--ok); box-shadow:0 0 0 3px var(--ok-soft); }
  .bad-dot { background:var(--bad); box-shadow:0 0 0 3px var(--bad-soft); }
  .warn-dot { background:var(--warn); box-shadow:0 0 0 3px var(--warn-soft); }
  .big { font-size:30px; font-weight:bold; letter-spacing:-.5px; }
  .grid2 { display:grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap:18px; }
  main { padding:22px; max-width:1400px; margin:auto; }
  h1, h2, h3 { line-height:1.4; }
  h2 { font-size:20px; } h3 { font-size:17px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:18px; box-shadow:var(--shadow); }
  .muted { color:var(--muted); }
  a { color:var(--accent); }
  .ltr { direction:ltr; unicode-bidi:embed; display:inline-block; }
  table { border-collapse:separate; border-spacing:0; width:100%; background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th, td { border-bottom:1px solid var(--line); padding:8px 10px; text-align:right; }
  tr:last-child td { border-bottom:none; }
  th { background:var(--soft); color:var(--muted); font-weight:600; font-size:13px; }
  tbody tr:hover td { background:#fafbfd; }
  td.num { text-align:left; direction:ltr; font-variant-numeric:tabular-nums; }
  input, select, button, textarea { font:inherit; padding:7px 11px; border-radius:8px; }
  input, select, textarea { border:1px solid #cfd6e3; background:#fff; color:var(--ink); transition:border-color .15s, box-shadow .15s; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  input[type=checkbox], input[type=radio] { padding:0; accent-color:var(--accent); }
  button { cursor:pointer; border:1px solid #cfd6e3; background:#fff; color:var(--ink); transition:background .15s, border-color .15s, transform .05s; }
  button:hover { background:var(--soft); border-color:#b8c2d3; }
  button:active { transform:translateY(1px); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  button.primary:hover { background:var(--accent-2); border-color:var(--accent-2); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .flash { padding:10px 14px; border-radius:10px; margin-bottom:12px; border:1px solid transparent; border-right-width:4px; }
  .flash.err { background:var(--bad-soft); color:var(--bad); border-color:#f5c2c2; border-right-color:var(--bad); }
  .flash.ok { background:var(--ok-soft); color:var(--ok); border-color:#bfe3cb; border-right-color:var(--ok); }
  kbd { border:1px solid #c5ccd8; border-bottom-width:2px; border-radius:5px; padding:0 6px; background:#fff; font-family:monospace; direction:ltr; display:inline-block; font-size:13px; }
  img { border-radius:8px; }

  .review { display:grid; grid-template-columns: 1fr 360px; gap:16px; }
  .imgs img.crop { max-width:100%; max-height:260px; border:3px solid var(--accent); border-radius:10px; background:#fff; image-rendering:auto; }
  .imgs img.full { max-width:100%; max-height:420px; border-radius:6px; margin-top:8px; }
  .thumbs img { height:90px; margin:4px; border:1px solid var(--line); cursor:zoom-in; }
  .cands { list-style:none; padding:0; margin:0; }
  .cands li { display:flex; gap:10px; align-items:center; padding:8px 10px; border:1px solid var(--line); border-radius:10px; transition:background .15s; margin-bottom:6px; cursor:pointer; }
  .cands li.hl { background:var(--accent-soft); border-color:var(--accent); }
  .cands li.dim { opacity:.35; }
  .cands .code { font-family:monospace; font-size:20px; font-weight:bold; direction:ltr; }
  .cands .score { margin-right:auto; color:var(--muted); font-size:12px; direction:ltr; }
  #typed { font-family:monospace; font-size:22px; width:100%; direction:ltr; text-align:center; letter-spacing:3px; }
  .actions { display:flex; gap:8px; margin-top:10px; }
  .actions button { flex:1; }
  .help { font-size:13px; line-height:2; }
  .pending { font-size:18px; }
  #typed-hint:empty { display:none; }
  #roi-wrap { position:relative; display:inline-block; max-width:100%; user-select:none; }
  #roi-wrap img { max-width:100%; display:block; }
  #roi-canvas { position:absolute; inset:0; width:100%; height:100%; cursor:crosshair; }
  {% block style %}{% endblock %}
</style>
</head>
<body>
<header>
  <span class="brand">بهسرد · شمارش کارتن</span>
  <a href="/" class="{{ 'active' if nav == 'dashboard' }}">داشبورد</a>
  <a href="/cameras" class="{{ 'active' if nav == 'cameras' }}">دوربین‌ها</a>
  <a href="/shifts" class="{{ 'active' if nav == 'shifts' }}">شیفت‌ها</a>
  {% set pb = pending_badge() %}
  <a href="/review" class="{{ 'active' if nav == 'review' }}">بررسی دستی{% if pb %} <span class="badge" id="pending-badge">{{ pb|fa }}</span>{% endif %}</a>
  <a href="/reports" class="{{ 'active' if nav == 'reports' }}">گزارش‌ها</a>
  <a href="/test" class="{{ 'active' if nav == 'test' }}">حالت آزمایش</a>
  <a href="/replay" class="{{ 'active' if nav == 'replay' }}">بازپخش ویدیو</a>
  <a href="/advanced" class="{{ 'active' if nav == 'advanced' }}">پیشرفته</a>
</header>
<main>
{% block content %}{% endblock %}
</main>
{% block script %}{% endblock %}
</body>
</html>
